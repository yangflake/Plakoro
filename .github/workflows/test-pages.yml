name: Deploy production plus Plakoro test server

on:
  push:
    branches: ["test-server"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}test/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable production
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
      - name: Checkout test version
        uses: actions/checkout@v4
        with:
          ref: test-server
          path: site/test
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload combined site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
